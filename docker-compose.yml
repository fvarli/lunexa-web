services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: lunexa-api:local
    container_name: lunexa-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: "http://localhost:3001,http://127.0.0.1:3001"
      SMTP_HOST: ${SMTP_HOST:-smtp.test.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-test@test.com}
      SMTP_PASS: ${SMTP_PASS:-}
      CONTACT_RECEIVER: ${CONTACT_RECEIVER:-hello@test.com}
      ENABLE_AUTOREPLY: "false"
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NEWSLETTER_SECRET: ${NEWSLETTER_SECRET:-}
      SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000"
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        NEXT_PUBLIC_GSC_VERIFICATION: ${NEXT_PUBLIC_GSC_VERIFICATION:-}
    image: lunexa-web:local
    container_name: lunexa-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 5s
      retries: 3
